[project]
name = "sourced"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "google-genai>=3.3.0",
    "httpcore>=1.0.9,<1.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "statsmodels>=0.15.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
